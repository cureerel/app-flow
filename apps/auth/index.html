<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>Auth</title>

    <script src="https://unpkg.com/htmx.org@2.0.4"></script>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: system-ui, sans-serif;
        }

        nav {
            padding: 16px;
            border-bottom: 1px solid #ddd;
        }

        main {
            max-width: 480px;
            margin: 0 auto;
            padding: 48px 20px;
        }

        form {
            display: grid;
            gap: 16px;
        }

        input {
            width: 100%;
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 6px;
        }

        button {
            padding: 12px 16px;
            border: 0;
            border-radius: 6px;
            background: black;
            color: white;
            cursor: pointer;
        }

        .switch {
            background: white;
            color: black;
            border: 1px solid #ccc;
        }
    </style>
</head>

<body>

<nav>
    <strong>MyApp Auth</strong>
</nav>

<main id="auth">

    <h1>Login</h1>

    <form
        hx-post="/login"
        hx-target="#auth"
        hx-swap="outerHTML">

        <input
            type="email"
            name="email"
            placeholder="Email"
            required>

        <input
            type="password"
            name="password"
            placeholder="Password"
            required>

        <button type="submit">
            Login
        </button>
    </form>

    <br>

    <button
        class="switch"
        hx-get="/signup"
        hx-target="#auth"
        hx-swap="outerHTML">
        Create account
    </button>

</main>

</body>
</html>
