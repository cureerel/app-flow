<!doctype html>
<html lang="en" data-theme="light">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Aura - Console</title>

    <style>
        * {
            box-sizing: border-box;
        }

        :root {
            --accent: #4F46E5;
            --accent-soft: #EEF2FF;
            --radius: 10px;
        }

        html[data-theme="light"] {
            --bg: #F3F4F6;
            --surface: #FFFFFF;
            --surface-2: #FAFAFB;
            --border: #E5E7EB;
            --text: #111827;
            --muted: #6B7280;
        }

        html[data-theme="cream"] {
            --bg: #F5F0E6;
            --surface: #FFFDF8;
            --surface-2: #FBF5E9;
            --border: #E7DDC7;
            --text: #2B2417;
            --muted: #8A7C5E;
        }

        html[data-theme="dark"] {
            --bg: #0F1115;
            --surface: #171A21;
            --surface-2: #1D212B;
            --border: #2A2F3A;
            --text: #F3F4F6;
            --muted: #8B93A3;
        }

        body {
            margin: 0;
            font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
            display: flex;
            transition: background 0.25s ease, color 0.25s ease;
        }

        a {
            color: inherit;
            text-decoration: none;
        }


        .sidebar {
            width: 220px;
            flex-shrink: 0;
            background: var(--surface);
            border-right: 1px solid var(--border);
            padding: 20px 14px;
            display: flex;
            flex-direction: column;
            gap: 24px;
        }

        .brand {
            font-weight: 700;
            font-size: 15px;
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 0 6px;
        }

        .brand .dot {
            width: 10px;
            height: 10px;
            border-radius: 3px;
            background: var(--accent);
        }

        nav {
            display: flex;
            flex-direction: column;
            gap: 2px;
        }

        nav a {
            font-size: 14px;
            font-weight: 500;
            color: var(--muted);
            padding: 9px 10px;
            border-radius: 8px;
            transition: background 0.15s ease, color 0.15s ease;
        }

        nav a:hover {
            background: var(--surface-2);
            color: var(--text);
        }

        nav a.active {
            background: var(--accent-soft);
            color: var(--accent);
        }


        .main {
            flex: 1;
            min-width: 0;
            padding: 20px 28px 40px;
        }

        header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 28px;
            gap: 16px;
            flex-wrap: wrap;
        }

        header h1 {
            font-size: 18px;
            font-weight: 700;
            margin: 0;
        }

        .header-actions {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .email-badge {
            background: var(--accent-soft);
            color: var(--accent);
            padding: 6px 14px;
            border-radius: 999px;
            font-weight: 500;
            font-size: 13px;
        }

        html[data-theme="dark"] .email-badge {
            background: rgba(79, 70, 229, 0.18);
        }

        .icon-btn {
            width: 34px;
            height: 34px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            border: 1px solid var(--border);
            border-radius: 8px;
            background: var(--surface);
            color: var(--muted);
            cursor: pointer;
            font-size: 15px;
            transition: border-color 0.15s ease, color 0.15s ease;
        }

        .icon-btn:hover {
            border-color: var(--accent);
            color: var(--accent);
        }

        .logout-form {
            margin: 0;
        }

        .logout-btn {
            font-size: 13px;
            font-weight: 500;
            color: var(--muted);
            border: 1px solid var(--border);
            padding: 8px 14px;
            border-radius: 8px;
            background: var(--surface);
            cursor: pointer;
            transition: all 0.15s ease;
        }

        .logout-btn:hover {
            border-color: #DC2626;
            color: #DC2626;
        }

        /* cards */
        .stats {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
            gap: 14px;
            margin-bottom: 24px;
        }

        .card {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 16px 18px;
        }

        .card .label {
            font-size: 12px;
            color: var(--muted);
            margin-bottom: 8px;
        }

        .card .value {
            font-size: 22px;
            font-weight: 700;
        }

        /* Tables */
        .panel {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            overflow: hidden;
        }

        .panel-head {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 14px 18px;
            border-bottom: 1px solid var(--border);
            font-size: 14px;
            font-weight: 600;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 13px;
        }

        th {
            text-align: left;
            font-weight: 500;
            color: var(--muted);
            padding: 10px 18px;
            border-bottom: 1px solid var(--border);
        }

        td {
            padding: 12px 18px;
            border-bottom: 1px solid var(--border);
        }

        tr:last-child td {
            border-bottom: none;
        }

        .empty-row {
            text-align: center;
            color: var(--muted);
            padding: 32px 18px;
        }
    </style>
</head>

<body>

<aside class="sidebar">
    <div class="brand"><span class="dot"></span> Aura </div>
    <nav>
        <a href="#" class="active">Dashboard</a>
        <a href="#">Contacts</a>
        <a href="#">Deals</a>
        <a href="#">Reports</a>
    </nav>
</aside>

<div class="main">
    <header>
        <h1>Welcome back</h1>

        <div class="header-actions">
            <span class="email-badge">{{ .Email }}</span>

            <button type="button" class="icon-btn" id="theme-toggle" title="Change theme">◐</button>

            <form class="logout-form" action="http://localhost:4000/auth/logout" method="POST">
                <button type="submit" class="logout-btn">Sign out</button>
            </form>
        </div>
    </header>

    <div class="stats">
        <div class="card">
            <div class="label">Pipeline value</div>
            <div class="value">$0</div>
        </div>
        <div class="card">
            <div class="label">Open deals</div>
            <div class="value">0</div>
        </div>
        <div class="card">
            <div class="label">Win rate</div>
            <div class="value">0%</div>
        </div>
    </div>

    <div class="panel">
        <div class="panel-head">Recent deals</div>
        <table>
            <thead>
                <tr>
                    <th>Company</th>
                    <th>Owner</th>
                    <th>Value</th>
                    <th>Stage</th>
                </tr>
            </thead>
            <tbody>
                <tr>
                    <td colspan="4" class="empty-row">No deals yet</td>
                </tr>
            </tbody>
        </table>
    </div>
</div>

<script>
    (function () {
        var themes = ["light", "cream", "dark"];
        var root = document.documentElement;
        var btn = document.getElementById("theme-toggle");

        function apply(theme) {
            root.setAttribute("data-theme", theme);
        }

        btn.addEventListener("click", function () {
            var current = themes.indexOf(root.getAttribute("data-theme"));
            var next = themes[(current + 1) % themes.length];
            apply(next);
        });
    })();
</script>

</body>
</html>
